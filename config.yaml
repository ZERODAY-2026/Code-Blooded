# config.yaml — Global application configuration (Section 9)
provider: api            # api | ollama
model: gemma-4-26b-a4b-it    # fast Gemma 4 MoE model available to your AI Studio key
local_model: gemma-2-9b-it # exact name from `ollama list`, used when provider: ollama
temperature:
  sql: 0.1
  repair: 0.1
  prose: 0.2
  second_opinion: 0.7
prompt_token_budget: 3000   # prune the schema to fit; matters most for the local model
rows_to_gemma: 50           # most result rows sent to the prose call
dataset: datasets/owid.yaml # active dataset configuration
limits:
  max_rows: 200
  max_retries: 2
  query_timeout_s: 30
cache_llm_responses: false  # keep false for demo/public mode; cached answers must never bypass live Snowflake queries
self_check: false           # second-SQL consistency check; enable if quota allows
public_mode: false          # true for hosted demo: fixed dataset, switch and mutate endpoints off, rate limits on
snowsight_base_url: ""      # optional; links query ID to Snowsight history
