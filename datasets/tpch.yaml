dataset: tpch
database: SNOWFLAKE_SAMPLE_DATA
schema: TPCH_SF1
description: "TPC-H Decision Support Benchmark (Scale Factor 1 ~ 1GB) hosted in Snowflake shared sample data"

tables:
  CUSTOMER:
    description: "Customer demographic and account balance records (150,000 rows)"
    columns:
      C_CUSTKEY: {type: "NUMBER(38,0)", description: "Primary identifier for customer", sample: 1}
      C_NAME: {type: "VARCHAR(25)", description: "Customer name formatted as Customer#000000001", sample: "Customer#000000001"}
      C_ADDRESS: {type: "VARCHAR(40)", description: "Customer street address", sample: "IVhzIApeRbVoAl"}
      C_NATIONKEY: {type: "NUMBER(38,0)", description: "Foreign key reference to NATION.N_NATIONKEY", sample: 15}
      C_PHONE: {type: "VARCHAR(15)", description: "Customer telephone contact", sample: "25-989-741-2972"}
      C_ACCTBAL: {type: "NUMBER(12,2)", description: "Customer account balance (can be negative)", sample: 711.56}
      C_MKTSEGMENT: {type: "VARCHAR(10)", description: "Market segment: AUTOMOBILE, BUILDING, FURNITURE, MACHINERY, HOUSEHOLD", sample: "BUILDING"}
      C_COMMENT: {type: "VARCHAR(117)", description: "Descriptive remarks", sample: "regular requests"}
    primary_key: ["C_CUSTKEY"]

  ORDERS:
    description: "Customer purchasing orders (1,500,000 rows)"
    columns:
      O_ORDERKEY: {type: "NUMBER(38,0)", description: "Primary identifier for order", sample: 1}
      O_CUSTKEY: {type: "NUMBER(38,0)", description: "Foreign key reference to CUSTOMER.C_CUSTKEY", sample: 36901}
      O_ORDERSTATUS: {type: "VARCHAR(1)", description: "Status: O (open), F (fulfilled), P (pending)", sample: "O"}
      O_TOTALPRICE: {type: "NUMBER(12,2)", description: "Total billed price for the order", sample: 173665.47}
      O_ORDERDATE: {type: "DATE", description: "Date order was placed (1992–1998)", sample: "1996-01-02"}
      O_ORDERPRIORITY: {type: "VARCHAR(15)", description: "Priority tier: 1-URGENT, 2-HIGH, 3-MEDIUM, 4-NOT SPECIFIED, 5-LOW", sample: "5-LOW"}
      O_CLERK: {type: "VARCHAR(15)", description: "Order processing clerk identifier", sample: "Clerk#000000951"}
      O_SHIPPRIORITY: {type: "NUMBER(38,0)", description: "Shipping priority indicator", sample: 0}
      O_COMMENT: {type: "VARCHAR(79)", description: "Clerk remarks", sample: "regular, pending instructions"}
    primary_key: ["O_ORDERKEY"]

  LINEITEM:
    description: "Individual item components and pricing within each order (6,001,215 rows)"
    columns:
      L_ORDERKEY: {type: "NUMBER(38,0)", description: "Foreign key reference to ORDERS.O_ORDERKEY", sample: 1}
      L_PARTKEY: {type: "NUMBER(38,0)", description: "Foreign key reference to PART.P_PARTKEY", sample: 155190}
      L_SUPPKEY: {type: "NUMBER(38,0)", description: "Foreign key reference to SUPPLIER.S_SUPPKEY", sample: 7706}
      L_LINENUMBER: {type: "NUMBER(38,0)", description: "Line item sequence number within order", sample: 1}
      L_QUANTITY: {type: "NUMBER(12,2)", description: "Quantity of items ordered", sample: 17.00}
      L_EXTENDEDPRICE: {type: "NUMBER(12,2)", description: "Extended item list price (before discount)", sample: 21168.23}
      L_DISCOUNT: {type: "NUMBER(12,2)", description: "Discount percentage rate (0.00 to 0.10)", sample: 0.04}
      L_TAX: {type: "NUMBER(12,2)", description: "Tax percentage rate", sample: 0.02}
      L_RETURNFLAG: {type: "VARCHAR(1)", description: "Return status flag: N (normal), R (returned), A (accepted)", sample: "N"}
      L_LINESTATUS: {type: "VARCHAR(1)", description: "Line item fulfillment status: O (open), F (finished)", sample: "O"}
      L_SHIPDATE: {type: "DATE", description: "Date item was shipped", sample: "1996-03-13"}
      L_COMMITDATE: {type: "DATE", description: "Committed delivery date", sample: "1996-04-14"}
      L_RECEIPTDATE: {type: "DATE", description: "Receipt date by customer", sample: "1996-03-21"}
      L_SHIPINSTRUCT: {type: "VARCHAR(25)", description: "Shipping instruction (e.g. DELIVER IN PERSON)", sample: "DELIVER IN PERSON"}
      L_SHIPMODE: {type: "VARCHAR(10)", description: "Shipping transit mode: AIR, SHIP, TRUCK, MAIL, REG AIR, FOB, RAIL", sample: "TRUCK"}
      L_COMMENT: {type: "VARCHAR(44)", description: "Line item commentary", sample: "egular courts"}
    primary_key: ["L_ORDERKEY", "L_LINENUMBER"]

  NATION:
    description: "Country and nation reference master (25 rows)"
    columns:
      N_NATIONKEY: {type: "NUMBER(38,0)", description: "Primary identifier for nation", sample: 0}
      N_NAME: {type: "VARCHAR(25)", description: "Standard nation name (e.g. JAPAN, UNITED STATES, BRAZIL)", sample: "ALGERIA"}
      N_REGIONKEY: {type: "NUMBER(38,0)", description: "Foreign key reference to REGION.R_REGIONKEY", sample: 0}
      N_COMMENT: {type: "VARCHAR(152)", description: "Geopolitical remarks", sample: " haggle"}
    primary_key: ["N_NATIONKEY"]

  REGION:
    description: "Continental geographic regions (5 rows: AFRICA, AMERICA, ASIA, EUROPE, MIDDLE EAST)"
    columns:
      R_REGIONKEY: {type: "NUMBER(38,0)", description: "Primary identifier for continental region", sample: 0}
      R_NAME: {type: "VARCHAR(25)", description: "Region name", sample: "AFRICA"}
      R_COMMENT: {type: "VARCHAR(152)", description: "Regional commentary", sample: "lar deposits"}
    primary_key: ["R_REGIONKEY"]

  SUPPLIER:
    description: "Component vendors and supplier organizations (10,000 rows)"
    columns:
      S_SUPPKEY: {type: "NUMBER(38,0)", description: "Primary identifier for supplier", sample: 1}
      S_NAME: {type: "VARCHAR(25)", description: "Supplier corporate name", sample: "Supplier#000000001"}
      S_ADDRESS: {type: "VARCHAR(40)", description: "Supplier street address", sample: "N kD4on9OM Ipw3tUs7Mm"}
      S_NATIONKEY: {type: "NUMBER(38,0)", description: "Foreign key reference to NATION.N_NATIONKEY", sample: 17}
      S_PHONE: {type: "VARCHAR(15)", description: "Telephone number", sample: "27-918-335-1736"}
      S_ACCTBAL: {type: "NUMBER(12,2)", description: "Supplier account balance", sample: 5755.94}
      S_COMMENT: {type: "VARCHAR(101)", description: "Supplier commentary", sample: "each accounts"}
    primary_key: ["S_SUPPKEY"]

  PART:
    description: "Catalog of industrial machinery parts and components (200,000 rows)"
    columns:
      P_PARTKEY: {type: "NUMBER(38,0)", description: "Primary identifier for part", sample: 1}
      P_NAME: {type: "VARCHAR(55)", description: "Part descriptive name", sample: "goldenrod lavender spring chocolate lace"}
      P_MFGR: {type: "VARCHAR(25)", description: "Manufacturing organization", sample: "Manufacturer#1"}
      P_BRAND: {type: "VARCHAR(10)", description: "Brand name", sample: "Brand#13"}
      P_TYPE: {type: "VARCHAR(25)", description: "Material specifications", sample: "PROMO BURNISHED COPPER"}
      P_SIZE: {type: "NUMBER(38,0)", description: "Part dimension integer size", sample: 7}
      P_CONTAINER: {type: "VARCHAR(10)", description: "Packaging container type", sample: "JUMBO PKG"}
      P_RETAILPRICE: {type: "NUMBER(12,2)", description: "Suggested retail unit price", sample: 901.00}
      P_COMMENT: {type: "VARCHAR(23)", description: "Catalog commentary", sample: "final excuses"}
    primary_key: ["P_PARTKEY"]

  PARTSUPP:
    description: "Part-supplier availability relationship and replenishment pricing (800,000 rows)"
    columns:
      PS_PARTKEY: {type: "NUMBER(38,0)", description: "Composite foreign key reference to PART.P_PARTKEY", sample: 1}
      PS_SUPPKEY: {type: "NUMBER(38,0)", description: "Composite foreign key reference to SUPPLIER.S_SUPPKEY", sample: 2}
      PS_AVAILQTY: {type: "NUMBER(38,0)", description: "Available stock on hand", sample: 3325}
      PS_SUPPLYCOST: {type: "NUMBER(12,2)", description: "Unit acquisition cost from supplier", sample: 771.64}
      PS_COMMENT: {type: "VARCHAR(199)", description: "Replenishment commentary", sample: "ironic dependencies"}
    primary_key: ["PS_PARTKEY", "PS_SUPPKEY"]
