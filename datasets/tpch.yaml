# datasets/tpch.yaml
# Semantic layer for the TPC-H benchmark dataset (read-only).
#
# Source: Snowflake's shared SNOWFLAKE_SAMPLE_DATA.TPCH_SF1 (scale factor 1).
# Licence: TPC-H benchmark specification — reference only, data is not
# copied into this repository (Section 4, G4).
#
# This file is the config-only second dataset.  Switching to it requires
# only changing `dataset: datasets/tpch.yaml` in config.yaml — no Python
# code changes.  No demo_mutation block because SNOWFLAKE_SAMPLE_DATA is
# shared and read-only (AGENTS.md Mistake #1).

name: tpch

snowflake:
  database: SNOWFLAKE_SAMPLE_DATA
  schema: TPCH_SF1

tables:
  customer:
    description: Registered customers who place orders
    columns:
      c_custkey:
        type: int
        description: Unique customer identifier (primary key)
        synonyms: [customer id, customer key, cust id]
      c_name:
        type: text
        description: Customer name
        synonyms: [customer name, name]
      c_address:
        type: text
        description: Street address of the customer
        synonyms: [address]
      c_nationkey:
        type: int
        description: Foreign key to the nation table (N_NATIONKEY)
        synonyms: [nation id, nation key]
      c_phone:
        type: text
        description: Customer phone number
        synonyms: [phone, telephone]
      c_acctbal:
        type: float
        description: Account balance in dollars
        sample_values: [711.56, 9255.67]
        synonyms: [account balance, balance]
      c_mktsegment:
        type: text
        description: Market segment the customer belongs to
        sample_values: ["BUILDING", "AUTOMOBILE", "MACHINERY", "HOUSEHOLD", "FURNITURE"]
        synonyms: [market segment, segment]
      c_comment:
        type: text
        description: Free-text comment

  orders:
    description: Purchase orders placed by customers
    columns:
      o_orderkey:
        type: int
        description: Unique order identifier (primary key)
        synonyms: [order id, order key, order number]
      o_custkey:
        type: int
        description: Foreign key to the customer table (C_CUSTKEY)
        synonyms: [customer id, customer key]
      o_orderstatus:
        type: text
        description: "Order status: F = fulfilled, O = open, P = partial"
        sample_values: ["F", "O", "P"]
        synonyms: [status, order status]
      o_totalprice:
        type: float
        description: Total price of the order in dollars
        sample_values: [173665.47, 46929.18]
        synonyms: [total, total price, order total, price, amount]
      o_orderdate:
        type: date
        description: Date the order was placed (YYYY-MM-DD)
        synonyms: [order date, date, placed on]
      o_orderpriority:
        type: text
        description: Priority level of the order
        sample_values: ["1-URGENT", "2-HIGH", "3-MEDIUM", "4-NOT SPECIFIED", "5-LOW"]
        synonyms: [priority, order priority]
      o_clerk:
        type: text
        description: Identifier of the clerk who processed the order
        synonyms: [clerk, processed by]
      o_shippriority:
        type: int
        description: Shipping priority (integer code)
        synonyms: [shipping priority]
      o_comment:
        type: text
        description: Free-text comment

  lineitem:
    description: Individual line items within an order (one row per product per order)
    columns:
      l_orderkey:
        type: int
        description: Foreign key to the orders table (O_ORDERKEY)
        synonyms: [order id, order key]
      l_partkey:
        type: int
        description: Foreign key to the part table (P_PARTKEY)
        synonyms: [part id, part key]
      l_suppkey:
        type: int
        description: Foreign key to the supplier table (S_SUPPKEY)
        synonyms: [supplier id, supplier key]
      l_linenumber:
        type: int
        description: Line item sequence number within the order
        synonyms: [line number, item number]
      l_quantity:
        type: float
        description: Quantity of the item ordered
        sample_values: [17.0, 36.0]
        synonyms: [qty, quantity, units]
      l_extendedprice:
        type: float
        description: Extended price (quantity × list price) in dollars
        sample_values: [21168.23, 45983.16]
        synonyms: [extended price, line price, price]
      l_discount:
        type: float
        description: Discount percentage applied to the line item (0.00 to 0.10)
        sample_values: [0.04, 0.09]
        synonyms: [discount, discount rate]
      l_tax:
        type: float
        description: Tax rate applied to the line item (0.00 to 0.08)
        sample_values: [0.02, 0.06]
        synonyms: [tax, tax rate]
      l_returnflag:
        type: text
        description: "Return flag: R = returned, A = accepted, N = none"
        sample_values: ["R", "A", "N"]
        synonyms: [return flag, return status]
      l_linestatus:
        type: text
        description: "Line status: O = open, F = shipped/fulfilled"
        sample_values: ["O", "F"]
        synonyms: [line status, status]
      l_shipdate:
        type: date
        description: Date the item was shipped
        synonyms: [ship date, shipped on, shipping date]
      l_commitdate:
        type: date
        description: Committed delivery date
        synonyms: [commit date, committed date, delivery date]
      l_receiptdate:
        type: date
        description: Date the item was received by the customer
        synonyms: [receipt date, received on, received date]
      l_shipinstruct:
        type: text
        description: Shipping instruction
        sample_values: ["DELIVER IN PERSON", "COLLECT COD", "NONE", "TAKE BACK RETURN"]
        synonyms: [shipping instruction, ship instruction]
      l_shipmode:
        type: text
        description: Mode of shipment
        sample_values: ["TRUCK", "MAIL", "REG AIR", "AIR", "FOB", "RAIL", "SHIP"]
        synonyms: [ship mode, shipping mode, shipping method]
      l_comment:
        type: text
        description: Free-text comment

  supplier:
    description: Suppliers who provide parts and fulfill line items
    columns:
      s_suppkey:
        type: int
        description: Unique supplier identifier (primary key)
        synonyms: [supplier id, supplier key, supp id]
      s_name:
        type: text
        description: Supplier name
        synonyms: [supplier name, name]
      s_address:
        type: text
        description: Street address of the supplier
        synonyms: [address]
      s_nationkey:
        type: int
        description: Foreign key to the nation table (N_NATIONKEY)
        synonyms: [nation id, nation key]
      s_phone:
        type: text
        description: Supplier phone number
        synonyms: [phone, telephone]
      s_acctbal:
        type: float
        description: Account balance in dollars
        sample_values: [5765.94, 3699.40]
        synonyms: [account balance, balance]
      s_comment:
        type: text
        description: Free-text comment

  nation:
    description: Nation/country lookup table (25 nations)
    columns:
      n_nationkey:
        type: int
        description: Unique nation identifier (primary key)
        synonyms: [nation id, nation key, country id]
      n_name:
        type: text
        description: Nation name (uppercase, e.g. GERMANY, UNITED STATES)
        sample_values: ["GERMANY", "UNITED STATES", "FRANCE", "JAPAN", "BRAZIL"]
        synonyms: [nation, country, country name]
      n_regionkey:
        type: int
        description: Foreign key to the region table (R_REGIONKEY)
        synonyms: [region id, region key]
      n_comment:
        type: text
        description: Free-text comment

  region:
    description: Geographic region lookup table (5 regions)
    columns:
      r_regionkey:
        type: int
        description: Unique region identifier (primary key)
        synonyms: [region id, region key]
      r_name:
        type: text
        description: Region name (uppercase)
        sample_values: ["AFRICA", "AMERICA", "ASIA", "EUROPE", "MIDDLE EAST"]
        synonyms: [region, region name, continent]
      r_comment:
        type: text
        description: Free-text comment

joins:
  # Customer ↔ Orders
  - from_table: orders
    to_table: customer
    "on": "orders.o_custkey = customer.c_custkey"

  # Orders ↔ Lineitem
  - from_table: lineitem
    to_table: orders
    "on": "lineitem.l_orderkey = orders.o_orderkey"

  # Lineitem ↔ Supplier
  - from_table: lineitem
    to_table: supplier
    "on": "lineitem.l_suppkey = supplier.s_suppkey"

  # Customer ↔ Nation
  - from_table: customer
    to_table: nation
    "on": "customer.c_nationkey = nation.n_nationkey"

  # Supplier ↔ Nation
  - from_table: supplier
    to_table: nation
    "on": "supplier.s_nationkey = nation.n_nationkey"

  # Nation ↔ Region
  - from_table: nation
    to_table: region
    "on": "nation.n_regionkey = region.r_regionkey"

notes:
  - "TPC-H is a read-only shared dataset in SNOWFLAKE_SAMPLE_DATA; no INSERT, UPDATE, or DELETE is possible."
  - "Order dates range from 1992-01-01 to 1998-08-02."
  - "Nation names and region names are stored in uppercase."
  - "Monetary values (prices, balances) are in dollars with two decimal places."

examples:
  - q: "Which 10 customers have the highest account balance?"
    sql: >-
      SELECT c_name, c_acctbal
      FROM customer
      ORDER BY c_acctbal DESC
      LIMIT 10

  - q: "What is the total revenue by nation for orders placed in 1995?"
    sql: >-
      SELECT n.n_name AS nation,
             SUM(l.l_extendedprice * (1 - l.l_discount)) AS revenue
      FROM customer c
      JOIN orders o ON c.c_custkey = o.o_custkey
      JOIN lineitem l ON o.o_orderkey = l.l_orderkey
      JOIN nation n ON c.c_nationkey = n.n_nationkey
      WHERE o.o_orderdate >= '1995-01-01'
        AND o.o_orderdate < '1996-01-01'
      GROUP BY n.n_name
      ORDER BY revenue DESC
      LIMIT 25

  - q: "How many orders were placed in each year?"
    sql: >-
      SELECT EXTRACT(YEAR FROM o_orderdate) AS order_year,
             COUNT(*) AS order_count
      FROM orders
      GROUP BY order_year
      ORDER BY order_year

# No demo_mutation block — SNOWFLAKE_SAMPLE_DATA is shared and read-only.
