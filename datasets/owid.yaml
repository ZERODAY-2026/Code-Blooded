# datasets/owid.yaml
# Semantic layer for the OWID (Our World in Data) dataset.
# All table and column names used by the application are loaded dynamically
# from this file — never hardcoded in Python code or prompts.

name: owid

snowflake:
  database: DATAMIND
  schema: OWID

tables:
  life_expectancy:
    description: Life expectancy at birth by country and year
    columns:
      entity:
        type: text
        description: Country or region name
        synonyms: [country, nation, state]
      code:
        type: text
        description: ISO 3166-1 alpha-3 country code, null for aggregate regions
        synonyms: [iso_code, country_code]
      year:
        type: int
        description: Calendar year
        synonyms: [date, period]
      life_expectancy:
        type: float
        description: Life expectancy at birth in years
        sample_values: [72.6, 81.3]
        synonyms: [lifespan, life span, longevity]

# Start with one fully defined table. Add another indicator only after its real
# table and columns are loaded and tested. Do not declare joins to undefined tables.
joins: []

notes: []  # Add only dataset-specific caveats verified from the source metadata.

examples:
  - q: "Which 5 countries had the highest life expectancy in 2019?"
    sql: >-
      SELECT entity, life_expectancy
      FROM life_expectancy
      WHERE year = 2019 AND code IS NOT NULL
      ORDER BY life_expectancy DESC
      LIMIT 5

  - q: "What was the life expectancy in Japan in 2020?"
    sql: >-
      SELECT entity, year, life_expectancy
      FROM life_expectancy
      WHERE entity = 'Japan' AND year = 2020

  - q: "How has life expectancy changed in India from 2000 to 2020?"
    sql: >-
      SELECT year, life_expectancy
      FROM life_expectancy
      WHERE entity = 'India' AND year BETWEEN 2000 AND 2020
      ORDER BY year

demo_mutation:
  description: >-
    Correct one country-year value so the demo question's answer visibly changes.
    Pick the country and year from the real data so the demo question's top 5 changes.
  # Absolute values so clicking twice cannot drift.
  # The load script creates life_expectancy_backup with CREATE TABLE ... CLONE.
  sql: >-
    UPDATE life_expectancy
    SET life_expectancy = 95.0
    WHERE entity = 'Japan' AND year = 2019
  reset_sql: >-
    UPDATE life_expectancy t
    SET life_expectancy = b.life_expectancy
    FROM life_expectancy_backup b
    WHERE t.entity = b.entity
      AND t.year = b.year
      AND t.entity = 'Japan'
      AND t.year = 2019
